name: quran_platform
description: Платформа уроков по Корану — Центр заучивания Корана
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.25.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.0
  firebase_crashlytics: ^3.4.0
  firebase_analytics: ^10.7.0
  google_sign_in: ^6.2.1

  # State Management
  flutter_bloc: ^8.1.4
  equatable: ^2.0.5

  # Navigation
  go_router: ^13.2.0

  # DI
  get_it: ^7.6.7
  injectable: ^2.3.2

  # Chat
  stream_chat_flutter: ^7.2.0

  # UI
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  flutter_animate: ^4.5.0

  # Calendar
  table_calendar: ^3.0.9

  # Images
  image_picker: ^1.0.7
  flutter_image_compress: ^2.1.0

  # Zoom
  url_launcher: ^6.2.4

  # Prayer times
  http: ^1.2.1
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  connectivity_plus: ^5.0.2
  permission_handler: ^11.3.0

  # Cupertino Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  injectable_generator: ^2.4.1
  build_runner: ^2.4.8
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  fake_cloud_firestore: ^2.4.9
  firebase_auth_mocks: ^0.13.0
  google_sign_in_mocks: ^0.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
